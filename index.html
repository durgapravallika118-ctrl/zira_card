<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zira Lights - Digital Card</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f1115; color: #333333; display: flex; justify-content: center; min-height: 100vh; padding: 0; }
        
        /* Main Mobile Container */
        .card-wrapper { background: #ffffff; max-width: 440px; width: 100%; min-height: 100vh; position: relative; box-shadow: 0 0 25px rgba(0,0,0,0.5); overflow: hidden; padding-bottom: 40px; }

        /* Blue-to-Red Gradient Banner */
        .header-banner { background: linear-gradient(135deg, #0077b6 0%, #000000 50%, #b7094c 100%); padding: 45px 20px 30px; text-align: center; color: #ffffff; position: relative; }
        .logo-circle { width: 95px; height: 95px; border-radius: 50%; background: #2b2b2b; border: 3px solid rgba(255,255,255,0.2); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: #d4af37; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .brand-title { font-size: 26px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 8px; text-transform: uppercase; }
        .tagline-pill { display: inline-block; border: 1px solid rgba(255, 255, 255, 0.4); padding: 5px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #ffffff; }

        /* Social Quick Bar */
        .social-bar { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid #eef0f2; background: #ffffff; }
        .social-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid #e5e7eb; background: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px; text-decoration: none; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .social-btn.wa { color: #25D366; }
        .social-btn.insta { color: #E1306C; }
        .social-btn.fb { color: #1877F2; }
        .social-btn.x { color: #000000; }
        .social-btn.yt { color: #FF0000; }
        .social-btn.map { color: #EA4335; }
        .social-btn.store { color: #a855f7; }

        /* Action Buttons Area */
        .action-area { padding: 20px; }
        .btn-main { width: 100%; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border: none; }
        .btn-orange { background: #ff5000; color: #ffffff; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(255, 80, 0, 0.25); }
        .btn-row { display: flex; gap: 12px; }
        .btn-green { background: #00c853; color: #ffffff; flex: 1; font-size: 15px; }
        .btn-outline { background: #ffffff; color: #2563eb; border: 2px solid #2563eb; flex: 1; font-size: 15px; }

        /* Accordion Gallery Slider Sections */
        .accordion-section { border-top: 1px solid #eeeeee; padding: 15px 20px; }
        .accordion-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; color: #222; cursor: pointer; padding: 5px 0; }
        .accordion-header i { font-size: 14px; transition: transform 0.3s; }
        .accordion-header.active i { transform: rotate(180deg); }

        .gallery-container { margin-top: 15px; display: block; }
        
        /* Main Image Viewer */
        .main-viewer { position: relative; width: 100%; height: 320px; border-radius: 14px; overflow: hidden; background: #0c0d10; display: flex; align-items: center; justify-content: center; }
        .main-viewer img { width: 100%; height: 100%; object-fit: contain; }
        
        .arrow-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, 0.85); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #333; box-shadow: 0 2px 6px rgba(0,0,0,0.2); z-index: 5; }
        .arrow-nav.left { left: 10px; }
        .arrow-nav.right { right: 10px; }

        .dots-indicator { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.5); }
        .dot.active { background: #ffffff; width: 10px; height: 10px; }

        /* Product Title Label Overlay */
        .product-label { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.7); color: #fff; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; z-index: 5; }

        /* Thumbnails Carousel Strip */
        .thumb-strip { display: flex; gap: 10px; overflow-x: auto; padding: 12px 0 5px; scrollbar-width: none; }
        .thumb-strip::-webkit-scrollbar { display: none; }
        .thumb-item { min-width: 65px; height: 65px; border-radius: 10px; overflow: hidden; border: 2px solid transparent; cursor: pointer; background: #1a1a1a; flex-shrink: 0; }
        .thumb-item.active { border-color: #0077b6; }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; }

        /* Contact Exchange Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 1000; align-items: flex-end; justify-content: center; }
        .modal-card { background: #ffffff; border-radius: 20px 20px 0 0; width: 100%; max-width: 440px; padding: 25px 20px; box-shadow: 0 -5px 25px rgba(0,0,0,0.3); animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-handle { width: 45px; height: 5px; background: #e0e0e0; border-radius: 3px; margin: 0 auto 18px; }
        .modal-title { font-size: 20px; font-weight: 800; color: #111827; margin-bottom: 6px; }
        .modal-sub { font-size: 13px; color: #4b5563; line-height: 1.4; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-label { display: block; font-size: 13px; font-weight: 700; color: #1f2937; margin-bottom: 6px; }
        .form-label span { color: #ef4444; }
        .form-label small { font-weight: 400; color: #6b7280; }
        
        .form-input { width: 100%; padding: 13px 15px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; outline: none; background: #fff; color: #111; }
        .phone-group { display: flex; gap: 10px; }
        .country-select { width: 110px; padding: 13px 10px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; background: #ffffff; color: #111; font-weight: 600; }
        
        .btn-note { display: inline-flex; align-items: center; gap: 8px; background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
        .note-textarea { display: none; margin-bottom: 15px; }
        
        .btn-continue { width: 100%; padding: 15px; background: #4338ca; color: #ffffff; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        .btn-notnow { width: 100%; padding: 14px; background: #ffffff; color: #111827; border: 1px solid #e5e7eb; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card-wrapper">
        
        <!-- Header Banner -->
        <div class="header-banner">
            <div class="logo-circle">ZL</div>
            <h1 class="brand-title">Zira lights</h1>
            <div class="tagline-pill">YOUR VISION, OUR LIGHTS!</div>
        </div>

        <!-- 7 Icon Social Bar -->
        <div class="social-bar">
            <a href="https://wa.me/919945415076" class="social-btn wa"><i class="fab fa-whatsapp"></i></a>
            <a href="https://instagram.com" class="social-btn insta"><i class="fab fa-instagram"></i></a>
            <a href="https://facebook.com" class="social-btn fb"><i class="fab fa-facebook-f"></i></a>
            <a href="https://x.com" class="social-btn x"><i class="fab fa-x-twitter"></i></a>
            <a href="https://youtube.com" class="social-btn yt"><i class="fab fa-youtube"></i></a>
            <a href="https://maps.google.com" class="social-btn map"><i class="fas fa-location-dot"></i></a>
            <a href="#" class="social-btn store"><i class="fas fa-store"></i></a>
        </div>

        <!-- Action Buttons Area -->
        <div class="action-area">
            <button class="btn-main btn-orange" onclick="openModal()">
                Exchange Contact
            </button>
            <div class="btn-row">
                <a href="tel:+919945415076" class="btn-main btn-green">
                    <i class="fas fa-phone-alt"></i> Call Office
                </a>
                <a href="contact.vcf" download class="btn-main btn-outline">
                    <i class="fas fa-download"></i> Save Contact
                </a>
            </div>
        </div>

        <!-- Section 1: Collection Catalog Gallery -->
        <div class="accordion-section">
            <div class="accordion-header active" onclick="toggleAccordion('gallery1', this)">
                <span>Pendant & Floor Lights</span>
                <i class="fas fa-caret-down"></i>
            </div>
            
            <div id="gallery1" class="gallery-container">
                <div class="main-viewer">
                    <div class="product-label" id="label1">ITAGLOW</div>
                    <button class="arrow-nav left" onclick="changeSlide(1, -1)"><i class="fas fa-chevron-left"></i></button>
                    <img id="mainImg1" src="itaglow.jpg" alt="ITAGLOW">
                    <button class="arrow-nav right" onclick="changeSlide(1, 1)"><i class="fas fa-chevron-right"></i></button>
                    <div class="dots-indicator" id="dots1"></div>
                </div>

                <div class="thumb-strip" id="thumbs1">
                    <div class="thumb-item active" onclick="setSlide(1, 0)"><img src="itaglow.jpg" alt="ITAGLOW"></div>
                    <div class="thumb-item" onclick="setSlide(1, 1)"><img src="elysra.jpg" alt="ELYSRA"></div>
                    <div class="thumb-item" onclick="setSlide(1, 2)"><img src="droop.jpg" alt="DROOP"></div>
                    <div class="thumb-item" onclick="setSlide(1, 3)"><img src="kins.jpg" alt="KINS"></div>
                    <div class="thumb-item" onclick="setSlide(1, 4)"><img src="ripple_glow.jpg" alt="RIPPLE GLOW"></div>
                </div>
            </div>
        </div>

        <!-- Section 2: Designer Lights Gallery -->
        <div class="accordion-section">
            <div class="accordion-header active" onclick="toggleAccordion('gallery2', this)">
                <span>Designer Collections</span>
                <i class="fas fa-caret-down"></i>
            </div>
            
            <div id="gallery2" class="gallery-container">
                <div class="main-viewer">
                    <div class="product-label" id="label2">BLOOM</div>
                    <button class="arrow-nav left" onclick="changeSlide(2, -1)"><i class="fas fa-chevron-left"></i></button>
                    <img id="mainImg2" src="bloom.jpg" alt="BLOOM">
                    <button class="arrow-nav right" onclick="changeSlide(2, 1)"><i class="fas fa-chevron-right"></i></button>
                    <div class="dots-indicator" id="dots2"></div>
                </div>

                <div class="thumb-strip" id="thumbs2">
                    <div class="thumb-item active" onclick="setSlide(2, 0)"><img src="bloom.jpg" alt="BLOOM"></div>
                    <div class="thumb-item" onclick="setSlide(2, 1)"><img src="totora.jpg" alt="TOTORA"></div>
                    <div class="thumb-item" onclick="setSlide(2, 2)"><img src="sway.jpg" alt="SWAY"></div>
                    <div class="thumb-item" onclick="setSlide(2, 3)"><img src="pinch.jpg" alt="PINCH"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Exchange Contact Modal Popup -->
    <div class="modal-overlay" id="contactModal">
        <div class="modal-card">
            <div class="modal-handle"></div>
            <h2 class="modal-title">Share your contact</h2>
            <p class="modal-sub">Enter your phone number (required) and we'll save this card to your contacts.</p>
            
            <form id="exchangeForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label class="form-label">Your name <span>*</span></label>
                    <input type="text" class="form-input" placeholder="Full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone <span>*</span></label>
                    <div class="phone-group">
                        <select class="country-select">
                            <option value="+91">IN +91</option>
                            <option value="+1">US +1</option>
                            <option value="+44">UK +44</option>
                        </select>
                        <input type="tel" class="form-input" placeholder="Phone number" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email <small>(optional)</small></label>
                    <input type="email" class="form-input" placeholder="you@example.com">
                </div>

                <button type="button" class="btn-note" onclick="toggleNote()">
                    <i class="far fa-file-alt"></i> Add a note
                </button>
                <div class="note-textarea" id="noteArea">
                    <textarea class="form-input" rows="3" placeholder="Write your message or request..."></textarea>
                </div>
                
                <button type="submit" class="btn-continue">Continue</button>
                <button type="button" class="btn-notnow" onclick="closeModal()">Not now</button>
            </form>
        </div>
    </div>

    <script>
        // Gallery Images and Names mapping
        const galleries = {
            1: [
                { name: "ITAGLOW", src: "itaglow.jpg" },
                { name: "ELYSRA", src: "elysra.jpg" },
                { name: "DROOP", src: "droop.jpg" },
                { name: "KINS", src: "kins.jpg" },
                { name: "RIPPLE GLOW", src: "ripple_glow.jpg" }
            ],
            2: [
                { name: "BLOOM", src: "bloom.jpg" },
                { name: "TOTORA", src: "totora.jpg" },
                { name: "SWAY", src: "sway.jpg" },
                { name: "PINCH", src: "pinch.jpg" }
            ]
        };

        const currentIndices = { 1: 0, 2: 0 };

        function initDots(gId) {
            const container = document.getElementById(`dots${gId}`);
            container.innerHTML = '';
            galleries[gId].forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                container.appendChild(dot);
            });
        }

        function setSlide(gId, idx) {
            currentIndices[gId] = idx;
            const item = galleries[gId][idx];
            document.getElementById(`mainImg${gId}`).src = item.src;
            document.getElementById(`label${gId}`).innerText = item.name;
            
            // Update thumbnails active state
            const thumbs = document.querySelectorAll(`#thumbs${gId} .thumb-item`);
            thumbs.forEach((t, i) => t.classList.toggle('active', i === idx));

            // Update dots
            const dots = document.querySelectorAll(`#dots${gId} .dot`);
            dots.forEach((d, i) => d.classList.toggle('active', i === idx));
        }

        function changeSlide(gId, direction) {
            let newIdx = currentIndices[gId] + direction;
            if (newIdx < 0) newIdx = galleries[gId].length - 1;
            if (newIdx >= galleries[gId].length) newIdx = 0;
            setSlide(gId, newIdx);
        }

        function toggleAccordion(id, headerEl) {
            const el = document.getElementById(id);
            const isVisible = el.style.display !== 'none';
            el.style.display = isVisible ? 'none' : 'block';
            headerEl.classList.toggle('active', !isVisible);
        }

        // Initialize dots
        initDots(1);
        initDots(2);

        // Modal Controls
        function openModal() { document.getElementById('contactModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('contactModal').style.display = 'none'; }
        function toggleNote() {
            const area = document.getElementById('noteArea');
            area.style.display = area.style.display === 'block' ? 'none' : 'block';
        }
        function handleFormSubmit(e) {
            e.preventDefault();
            alert('Contact details submitted!');
            closeModal();
        }
    </script>
</body>
</html>
